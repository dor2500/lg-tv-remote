<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <title>Universal TV Remote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="room">
    <aside class="remote" data-i18n-aria="remote">
      <div class="remote-top">
        <button class="key power" id="power" data-i18n-title="powerOff" data-i18n-aria="powerOff">⏻</button>
        <button class="lang" id="lang" data-i18n="switchTo"></button>
        <span id="led" class="led" data-i18n-title="connectionState"></span>
      </div>

      <div class="numpad" id="numpad" dir="ltr"></div>

      <div class="rockers">
        <div class="rocker">
          <button class="key" data-button="VOLUMEUP" data-i18n-aria="volumeUp">+</button>
          <span data-i18n="volumeLabel"></span>
          <button class="key" data-button="VOLUMEDOWN" data-i18n-aria="volumeDown">−</button>
        </div>
        <button class="key mute" id="mute" aria-pressed="false" data-i18n="mute"></button>
        <div class="rocker">
          <button class="key" data-button="CHANNELUP" data-i18n-aria="channelNext">▲</button>
          <span data-i18n="channelLabel"></span>
          <button class="key" data-button="CHANNELDOWN" data-i18n-aria="channelPrev">▼</button>
        </div>
      </div>

      <input id="volume" class="volume" type="range" min="0" max="100" value="0" data-i18n-aria="volume" disabled>

      <div class="dpad" dir="ltr">
        <button class="key arrow up" data-button="UP" data-i18n-aria="up">▲</button>
        <button class="key arrow left" data-button="LEFT" data-i18n-aria="left">◀</button>
        <button class="key ok" data-button="ENTER">OK</button>
        <button class="key arrow right" data-button="RIGHT" data-i18n-aria="right">▶</button>
        <button class="key arrow down" data-button="DOWN" data-i18n-aria="down">▼</button>
      </div>

      <div class="row3">
        <button class="key" data-button="BACK" data-i18n="back"></button>
        <button class="key" data-button="HOME" data-i18n="home"></button>
        <button class="key" data-button="EXIT" data-i18n="exit"></button>
      </div>
      <div class="row3">
        <button class="key" data-button="QMENU" data-i18n="settings"></button>
        <button class="key" data-button="GUIDE" data-i18n="guide"></button>
        <button class="key" data-button="INFO" data-i18n="info"></button>
      </div>

      <div class="colors" dir="ltr">
        <button class="key c red" data-button="RED" data-i18n-aria="red"></button>
        <button class="key c green" data-button="GREEN" data-i18n-aria="green"></button>
        <button class="key c yellow" data-button="YELLOW" data-i18n-aria="yellow"></button>
        <button class="key c blue" data-button="BLUE" data-i18n-aria="blue"></button>
      </div>

      <div class="media" dir="ltr">
        <button class="key" data-button="REWIND" data-i18n-aria="rewind">&#x23EA;&#xFE0E;</button>
        <button class="key" data-button="PLAY" data-i18n-aria="play">&#x25B6;&#xFE0E;</button>
        <button class="key" data-button="PAUSE" data-i18n-aria="pause">&#x23F8;&#xFE0E;</button>
        <button class="key" data-button="STOP" data-i18n-aria="stop">&#x23F9;&#xFE0E;</button>
        <button class="key" data-button="FASTFORWARD" data-i18n-aria="fastForward">&#x23E9;&#xFE0E;</button>
      </div>
    </aside>

    <section class="tv">
      <div class="bezel">
        <div class="screen" id="screen">
          <img id="frame" data-i18n-alt="frameAlt" alt="" hidden>

          <form class="connect" id="connect-form" autocomplete="off">
            <h1 data-i18n="connectTitle"></h1>
            <p class="hint" data-i18n="connectHint"></p>
            <label for="brand" data-i18n="tvType"></label>
            <select id="brand">
              <option value="auto" data-i18n="brandAuto"></option>
              <option value="webos">LG (webOS)</option>
              <option value="samsung">Samsung (Tizen)</option>
              <option value="androidtv">Android TV / Google TV</option>
              <option value="roku">Roku</option>
              <option value="vizio">Vizio (SmartCast)</option>
              <option value="sony" data-i18n="brandSony"></option>
            </select>
            <label for="host" data-i18n="tvAddress"></label>
            <div class="inline">
              <input id="host" dir="ltr" placeholder="192.168.1.50" required spellcheck="false">
              <button type="submit" class="primary" id="connect-btn" data-i18n="connect"></button>
            </div>
            <div class="inline">
              <button type="button" id="scan" data-i18n="scan"></button>
              <button type="button" id="pin-mode" data-i18n="connectPin"></button>
            </div>
            <ul id="tv-list" class="tv-list"></ul>
            <p class="message" id="connect-msg" role="status"></p>
            <div class="inline" id="pin-row" hidden>
              <input id="pin" dir="ltr" inputmode="numeric" data-i18n-placeholder="pinPlaceholder" data-i18n-aria="pinCode">
              <button type="button" class="primary" id="pin-send" data-i18n="sendPin"></button>
            </div>
          </form>

          <div class="placeholder" id="placeholder" hidden>
            <p id="view-text"></p>
            <button id="placeholder-live" class="primary" data-i18n="showScreen"></button>
          </div>

          <div class="cursor" id="cursor" hidden><span></span></div>

          <p class="lock-hint" id="lock-hint" data-i18n="lockHint" hidden></p>
        </div>
      </div>

      <div class="stand" id="stand" hidden>
        <button id="live" aria-pressed="false"></button>
        <label class="rate"><span data-i18n="rate"></span>
          <select id="rate">
            <option value="250" data-i18n="rateFast"></option>
            <option value="500" data-i18n="rateNormal" selected></option>
            <option value="1500" data-i18n="rateEconomy"></option>
          </select>
        </label>
        <span class="stat" id="fps"></span>
        <button id="lock" data-i18n="lock"></button>
        <span class="tv-name" id="tv-name"></span>
        <button id="screen-toggle" aria-pressed="false"></button>
        <button id="disconnect" data-i18n="disconnect"></button>
      </div>
    </section>

    <aside class="drawer" id="drawer" hidden>
      <div class="panel" id="panel-apps">
        <h2 data-i18n="apps"></h2>
        <p class="hint" id="apps-hint" data-i18n="appsCommonHint" hidden></p>
        <input id="app-filter" data-i18n-placeholder="searchApps" data-i18n-aria="searchApps">
        <ul id="apps" class="list"></ul>
      </div>

      <div class="panel" id="panel-inputs">
        <h2 data-i18n="inputs"></h2>
        <ul id="inputs" class="list"></ul>
      </div>

      <div class="panel" id="panel-text">
      <h2 data-i18n="typing"></h2>
      <p class="hint" data-i18n="typingHint"></p>
      <form id="text-form" class="stack">
        <input id="text" data-i18n-placeholder="textToSend" data-i18n-aria="textToSend">
        <div class="inline">
          <button type="submit" data-i18n="send"></button>
          <button type="button" id="text-del" data-i18n="deleteChar"></button>
          <button type="button" id="text-enter" data-i18n="confirm"></button>
        </div>
      </form>
      </div>
    </aside>
  </main>
  <div class="toast" id="toast" role="alert" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
