name = "tv-anywhere-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# The phone app is served from the same address as the relay.
[assets]
directory = "../dist/phone"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
